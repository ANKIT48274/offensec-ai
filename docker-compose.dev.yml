services:
  postgres:
    image: postgres:16-alpine
    container_name: offensec-postgres-dev
    restart: no
    environment:
      POSTGRES_DB: offensec
      POSTGRES_USER: offensec
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./infra/docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offensec_dev
    secrets:
      - postgres_password

  redis:
    image: redis:7-alpine
    container_name: offensec-redis-dev
    restart: no
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_dev:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - offensec_dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: offensec-backend-dev
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://offensec:changeme@postgres:5432/offensec
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      AI_MODEL_PROVIDER: local
      AI_MODEL_BASE_URL: http://ai-runner:8001
      PLUGIN_SANDBOX_ENABLED: "true"
      SCOPE_ENFORCEMENT: "true"
      PORT: 8000
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    networks:
      - offensec_dev
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: offensec-frontend-dev
    restart: no
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    networks:
      - offensec_dev

  ai-runner:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    container_name: offensec-ai-runner-dev
    restart: no
    depends_on:
      - redis
    environment:
      AI_MODEL_PROVIDER: local
      REDIS_URL: redis://redis:6379/1
      GPU_ENABLED: "false"
      PORT: 8001
    volumes:
      - ./ai:/app/offensec/ai
      - ./knowledge:/app/offensec/knowledge
    ports:
      - "${AI_RUNNER_HOST_PORT:-8001}:8001"
    networks:
      - offensec_dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  offensec_dev:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
