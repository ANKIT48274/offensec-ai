[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "offensec*"]
namespaces = true

[project]
name = "offensec-backend"
version = "0.1.0"
description = "OffenSec AI Backend API"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "OffenSec AI Contributors" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
    "websockets>=14.0",
    "cryptography>=44.0.0",
    "orjson>=3.10.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httptools>=0.6.0",
    "factory-boy>=3.3.0",
    "testcontainers>=4.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["__pycache__", ".venv", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["__pycache__", ".venv", "alembic/"]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["../tests/unit/backend", "../tests/integration/api"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]
filterwarnings = ["error"]
