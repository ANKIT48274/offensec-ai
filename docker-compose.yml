services:
  postgres:
    image: postgres:16-alpine
    container_name: offensec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: offensec
      POSTGRES_USER: ${POSTGRES_USER:-offensec}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offensec_internal
    secrets:
      - postgres_password

  redis:
    image: redis:7-alpine
    container_name: offensec-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - offensec_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: offensec-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-offensec}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/offensec
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-local}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-null}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-http://ai-runner:8001}
      PLUGIN_SANDBOX_ENABLED: "true"
      SCOPE_ENFORCEMENT: "true"
      PORT: 8000
    volumes:
      - ./backend:/app:ro
      - logs_backend:/var/log/offensec
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "httman", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - offensec_internal
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4 --timeout-keep-alive 65

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offensec-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_WS_URL:-ws://localhost:8000/ws}
      NODE_ENV: production
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    networks:
      - offensec_internal

  ai-runner:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.ai
    container_name: offensec-ai-runner
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    environment:
      AI_MODEL_PROVIDER: ${AI_MODEL_PROVIDER:-local}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-null}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-}
      REDIS_URL: redis://redis:6379/1
      GPU_ENABLED: "${GPU_ENABLED:-false}"
      GPU_DEVICE: "${GPU_DEVICE:-0}"
      PORT: 8001
    volumes:
      - ai_models:/models
      - logs_ai:/var/log/offensec
    ports:
      - "${AI_RUNNER_HOST_PORT:-8001}:8001"
    deploy:
      resources:
        limits:
          memory: ${AI_MEMORY_LIMIT:-4g}
    networks:
      - offensec_internal

  plugin-sandbox:
    build:
      context: ./plugins
      dockerfile: Dockerfile
    container_name: offensec-plugin-sandbox
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    environment:
      SANDBOX_ENABLED: "true"
      SANDBOX_NETWORK_MODE: isolated
      REDIS_URL: redis://redis:6379/2
      PORT: 8002
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - plugins_data:/opt/plugins:ro
      - logs_sandbox:/var/log/offensec
    ports:
      - "${SANDBOX_HOST_PORT:-8002}:8002"
    networks:
      - offensec_internal

  plugin-sandbox-internal:
    build:
      context: ./plugins
      dockerfile: Dockerfile.sandbox
    container_name: offensec-sandbox-plugins
    restart: unless-stopped
    depends_on:
      plugin-sandbox:
        condition: service_started
    environment:
      SANDBOX_ORCHESTRATOR_URL: http://plugin-sandbox:8002
      SANDBOX_PLUGIN_REGISTRY: ${PLUGIN_REGISTRY_URL:-http://plugin-sandbox:8002/plugins}
    security_opt:
      - no-new-privileges:true
    networks:
      - offensec_sandboxed

volumes:
  postgres_data:
  redis_data:
  ai_models:
  plugins_data:
  logs_backend:
  logs_ai:
  logs_sandbox:

networks:
  offensec_internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
  offensec_sandboxed:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres_password.txt}
