services:
  postgres:
    image: postgres:16-alpine
    container_name: offensec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: offensec
      POSTGRES_USER: ${POSTGRES_USER:-offensec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offensec"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - offensec_internal

  redis:
    image: redis:7-alpine
    container_name: offensec-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-512mb}"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - offensec_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: offensec-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-offensec}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/offensec
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - offensec_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offensec-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${FRONTEND_WS_URL:-ws://localhost:8000/ws}
      NODE_ENV: production
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    networks:
      - offensec_internal

volumes:
  postgres_data:
  redis_data:

networks:
  offensec_internal:
    driver: bridge
