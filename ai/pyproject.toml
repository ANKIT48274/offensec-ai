[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["offensec*"]
namespaces = true

[project]
name = "offensec-ai-engine"
version = "0.1.0"
description = "OffenSec AI — AI Engine"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ankit Patidar", email = "ankitpatidar.sec@gmail.com" },
    { name = "OffenSec AI Contributors" },
]

dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "redis[hiredis]>=5.2.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
local = [
    "transformers>=4.47.0",
    "torch>=2.5.0",
    "sentencepiece>=0.2.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
]
cloud = [
    "litellm>=1.55.0",
    "openai>=1.55.0",
    "anthropic>=0.47.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["../tests/unit/ai"]
asyncio_mode = "auto"
